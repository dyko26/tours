<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Guía de Campo Chachagua</title>
  <meta name="description" content="Guía de campo offline del bosque muy húmedo tropical de La Pechuga, Chachagua, San Carlos, Costa Rica.">
  <meta name="theme-color" content="#F4F1EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chachagua">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { parchment: '#F4F1EA', moss: '#E8EDDF' },
          fontFamily: {
            serif: ['Georgia', 'Cambria', '"Times New Roman"', 'serif'],
            sans: ['system-ui', '-apple-system', '"Segoe UI"', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    html { -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
    body { background: #F4F1EA; color: #44403c; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    ::selection { background: #d9f99d; color: #14532d; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid #047857; outline-offset: 2px; border-radius: 6px; }
    input, textarea, button, select { accent-color: #047857; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #F4F1EA; }
    ::-webkit-scrollbar-thumb { background: #d6cfbf; border-radius: 10px; border: 2px solid #F4F1EA; }
    [hidden] { display: none !important; }
    input[type="search"]::-webkit-search-cancel-button { display: none; }
    .fade-in { animation: fadeIn .28s ease-out both; }
    .rise-in { animation: riseIn .32s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    #modal[data-state="open"] .modal-backdrop { opacity: 1; }
    #modal[data-state="open"] .modal-panel { opacity: 1; transform: none; }
    .modal-backdrop { opacity: 0; transition: opacity .22s ease; }
    .modal-panel { opacity: 0; transform: translateY(24px) scale(.98); transition: opacity .25s ease, transform .28s cubic-bezier(.2,.8,.2,1); }
    .prose-field p { line-height: 1.7; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body class="bg-parchment text-stone-700 antialiased min-h-screen flex flex-col">

  <!-- ============ HEADER ============ -->
  <header class="sticky top-0 z-30 bg-parchment/95 backdrop-blur border-b border-amber-900/10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 pt-4 pb-3">
      <div class="flex items-start justify-between gap-4">
        <div class="flex items-center gap-3 min-w-0">
          <img src="icons/icon.svg" alt="" class="w-10 h-10 shrink-0 rounded-xl" width="40" height="40">
          <div class="min-w-0">
            <h1 class="font-serif text-xl sm:text-2xl text-green-900 leading-tight truncate" data-i18n="appTitle">Guía de Campo Chachagua</h1>
            <p class="text-xs sm:text-sm text-stone-600 truncate" data-i18n="appSubtitle">La Pechuga, Chachagua, San Carlos</p>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <span id="net-status" class="hidden sm:inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full border border-emerald-700/20 bg-green-50 text-green-900"></span>
          <button id="install-btn" type="button" hidden
                  class="hidden sm:inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-full border border-amber-800/30 text-amber-800 hover:bg-amber-50 transition">
            <span data-icon="download" class="w-4 h-4"></span><span data-i18n="install">Instalar</span>
          </button>

          <!-- Language toggle -->
          <div class="flex items-center gap-2">
            <span class="sr-only" data-i18n="langLabel">Idioma</span>
            <button id="lang-toggle" type="button" role="switch" aria-checked="false"
                    class="relative inline-flex items-center h-9 w-[88px] rounded-full bg-white border border-emerald-700/25 shadow-sm p-1 text-xs font-semibold tracking-wide select-none">
              <span id="lang-knob" class="absolute top-1 left-1 h-7 w-[39px] rounded-full bg-emerald-700 transition-transform duration-300 ease-out"></span>
              <span data-lang-opt="es" class="relative z-10 flex-1 text-center transition-colors">ES</span>
              <span data-lang-opt="en" class="relative z-10 flex-1 text-center transition-colors">EN</span>
            </button>
          </div>
        </div>
      </div>

      <div class="mt-3 flex flex-col sm:flex-row gap-3 sm:items-center">
        <label class="relative flex-1">
          <span class="sr-only" data-i18n="searchLabel">Buscar</span>
          <span data-icon="search" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-stone-500 pointer-events-none"></span>
          <input id="search" type="search" autocomplete="off" spellcheck="false"
                 data-i18n-placeholder="searchPlaceholder"
                 class="w-full h-11 pl-10 pr-10 rounded-xl bg-white border border-amber-900/15 text-stone-800 placeholder-stone-400 shadow-sm focus:border-emerald-600 focus:ring-2 focus:ring-emerald-600/20 transition">
          <button id="search-clear" type="button" hidden data-i18n-aria="clearSearch"
                  class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 inline-flex items-center justify-center rounded-lg text-stone-500 hover:bg-stone-100 hover:text-green-900">
            <span data-icon="x" class="w-4 h-4"></span>
          </button>
        </label>

        <nav class="flex bg-white/70 border border-amber-900/10 rounded-xl p-1 shrink-0" role="tablist">
          <button type="button" role="tab" data-view="guide"
                  class="tab-btn flex-1 sm:flex-none inline-flex items-center justify-center gap-2 px-4 h-9 rounded-lg text-sm font-medium transition">
            <span data-icon="grid" class="w-4 h-4"></span><span data-i18n="navGuide">Guía</span>
          </button>
          <button type="button" role="tab" data-view="logbook"
                  class="tab-btn flex-1 sm:flex-none inline-flex items-center justify-center gap-2 px-4 h-9 rounded-lg text-sm font-medium transition">
            <span data-icon="book" class="w-4 h-4"></span><span data-i18n="navLogbook">Bitácora</span>
            <span id="log-badge" class="min-w-[1.25rem] h-5 px-1.5 rounded-full bg-amber-100 text-amber-800 text-[11px] font-semibold inline-flex items-center justify-center">0</span>
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- ============ VIEW: GUIDE ============ -->
  <main id="view-guide" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6">
    <section aria-labelledby="cat-title">
      <div class="flex items-end justify-between gap-4 mb-4">
        <div>
          <h2 id="cat-title" class="font-serif text-2xl text-green-900" data-i18n="categoriesTitle">Categorías</h2>
          <p class="text-sm text-stone-600 max-w-2xl" data-i18n="categoriesIntro"></p>
        </div>
      </div>
      <div id="category-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
    </section>

    <section class="mt-10" aria-labelledby="list-title">
      <div class="flex flex-wrap items-end justify-between gap-3 mb-4">
        <div>
          <h2 id="list-title" class="font-serif text-2xl text-green-900"></h2>
          <p id="list-count" class="text-sm text-stone-600"></p>
        </div>
        <button id="show-all" type="button" hidden
                class="inline-flex items-center gap-2 text-sm font-medium px-3 py-1.5 rounded-lg border border-emerald-700/30 text-emerald-800 hover:bg-green-50 transition">
          <span data-icon="x" class="w-4 h-4"></span><span data-i18n="showAll">Mostrar todo</span>
        </button>
      </div>
      <div id="entry-list" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div id="no-results" hidden class="text-center py-16 rounded-2xl border border-dashed border-amber-900/20 bg-white/60">
        <span data-icon="search" class="w-8 h-8 mx-auto text-amber-800/60 block"></span>
        <p class="mt-3 font-serif text-lg text-green-900" data-i18n="noResults">Sin resultados</p>
        <p class="text-sm text-stone-600" data-i18n="noResultsHint"></p>
      </div>
    </section>
  </main>

  <!-- ============ VIEW: LOGBOOK ============ -->
  <main id="view-logbook" hidden class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6">
    <div class="flex flex-wrap items-end justify-between gap-4 mb-5">
      <div>
        <h2 class="font-serif text-2xl text-green-900" data-i18n="logbookTitle">Bitácora de avistamientos</h2>
        <p class="text-sm text-stone-600 max-w-2xl" data-i18n="logbookIntro"></p>
      </div>
      <div class="flex gap-2">
        <button id="export-btn" type="button"
                class="inline-flex items-center gap-2 text-sm font-medium px-3 py-2 rounded-lg bg-white border border-emerald-700/30 text-emerald-800 hover:bg-green-50 transition">
          <span data-icon="download" class="w-4 h-4"></span><span data-i18n="export">Exportar</span>
        </button>
        <button id="clear-btn" type="button"
                class="inline-flex items-center gap-2 text-sm font-medium px-3 py-2 rounded-lg bg-white border border-amber-800/30 text-amber-800 hover:bg-amber-50 transition">
          <span data-icon="trash" class="w-4 h-4"></span><span data-i18n="clearAll">Vaciar</span>
        </button>
      </div>
    </div>

    <div id="log-stats" class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6"></div>
    <div id="log-filters" class="flex flex-wrap gap-2 mb-4"></div>
    <ol id="log-list" class="space-y-3"></ol>
    <div id="log-empty" hidden class="text-center py-16 rounded-2xl border border-dashed border-amber-900/20 bg-white/60">
      <span data-icon="book" class="w-8 h-8 mx-auto text-amber-800/60 block"></span>
      <p class="mt-3 font-serif text-lg text-green-900" data-i18n="emptyLogbook"></p>
      <p class="text-sm text-stone-600" data-i18n="emptyLogbookHint"></p>
    </div>
  </main>

  <footer class="border-t border-amber-900/10 mt-8">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 text-xs text-stone-600 leading-relaxed">
      <p data-i18n="footer"></p>
    </div>
  </footer>

  <!-- ============ MODAL ============ -->
  <div id="modal" hidden data-state="closed" class="fixed inset-0 z-50" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop absolute inset-0 bg-amber-950/25 backdrop-blur-sm" data-close></div>
    <div class="absolute inset-0 flex items-end sm:items-center justify-center p-0 sm:p-6 pointer-events-none">
      <article class="modal-panel pointer-events-auto w-full sm:max-w-3xl max-h-[92vh] overflow-y-auto bg-white rounded-t-3xl sm:rounded-3xl shadow-xl border border-amber-900/10">
        <div id="modal-content"></div>
      </article>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div id="toast" role="status" aria-live="polite"
       class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl bg-emerald-700 text-white text-sm shadow-lg opacity-0 translate-y-3 pointer-events-none transition duration-300"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
